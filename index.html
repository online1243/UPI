<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Receipt Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        #receipt {
            width: 380px;
            background: white;
            padding: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .main-padding { padding: 20px; }

        /* Header Layout: Bank Left, Logo Right */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .bank-name { font-size: 18px; color: #555; font-weight: 500; }
        .upi-logo { width: 70px; }

        /* Grey Box Section (To / Sending) */
        .sending-box {
            background-color: #f1f3f4; /* Light Greyish box */
            padding: 15px 20px;
            margin: 10px 0;
        }

        /* Flex Row for Left-Right alignment */
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            align-items: baseline;
        }

        .label {
            color: #757575;
            font-size: 14px;
            text-transform: uppercase;
            flex: 1;
        }

        .value {
            color: #333;
            font-size: 16px;
            font-weight: 500;
            text-align: right;
            flex: 2;
            outline: none;
        }

        .big-amount {
            font-size: 22px;
            font-weight: bold;
            color: #222;
        }

        .editable:hover { background: #ffffd2; cursor: pointer; }
        
        /* Buttons */
        .btn-container { margin-top: 20px; }
        .download-btn {
            padding: 12px 30px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="receipt">
        <div class="main-padding">
            <div class="header">
                <div>
                    <div contenteditable="true" class="bank-name editable">HDFC Bank</div>
                    <div contenteditable="true" class="editable" style="color:#777; font-size: 15px;">XXXX0390</div>
                </div>
                <img src="https://latestlogo.com/wp-content/uploads/2024/03/upi-logo.png" class="upi-logo">
            </div>
        </div>

        <div class="sending-box">
            <div class="row">
                <span style="color:#757575;">To:</span>
                <span contenteditable="true" class="editable value" style="font-weight: bold; font-size: 17px;">Keval Rupesh Sh...</span>
            </div>
            <div class="row" style="margin-bottom: 0;">
                <span style="color:#757575;">Sending:</span>
                <span class="value big-amount">₹ <span contenteditable="true" class="editable">85000.00</span></span>
            </div>
        </div>

        <div class="main-padding">
            <div class="row">
                <span class="label">PAYING TO</span>
                <span contenteditable="true" class="value editable">Keval Rupesh Shah</span>
            </div>

            <div class="row">
                <span class="label">AMOUNT</span>
                <span class="value">₹ <span contenteditable="true" class="editable">85000.00</span></span>
            </div>

            <div class="row">
                <span class="label">ACCOUNT</span>
                <span contenteditable="true" class="value editable">XXXXXX0390</span>
            </div>

            <div class="row" style="align-items: flex-start;">
                <span class="label">DETAILS</span>
                <span contenteditable="true" class="value editable" style="line-height: 1.3;">26700 withdrawal pending charge pay</span>
            </div>

            <div class="row" style="flex-direction: column; align-items: flex-start; margin-top: 10px;">
                <span class="label">REF ID</span>
                <span contenteditable="true" class="editable" style="font-family: monospace; font-size: 13px; color: #555; width: 100%; margin-top: 5px;">PTM69749e7fe9bf427f9f0ec810e4382fd2</span>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="download-btn" onclick="takeShot()">Save as PNG</button>
    </div>

    <script>
        function takeShot() {
            const receipt = document.getElementById('receipt');
            html2canvas(receipt, {
                scale: 3, // High quality
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'UPI_Transaction.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
