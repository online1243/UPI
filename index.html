<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium UPI Receipt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-main: #333;
            --text-muted: #757575;
            --accent: #007bff;
        }

        body { 
            background-color: var(--bg-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            margin: 0;
        }

        /* The Main Receipt Card */
        #receipt {
            width: 380px;
            background: white;
            border-radius: 20px; /* Sexy Curves */
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            position: relative;
        }

        .main-padding { padding: 24px; }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .bank-name { font-size: 18px; color: #444; font-weight: 600; letter-spacing: -0.5px; }
        .upi-logo { width: 65px; height: auto; filter: grayscale(0.2); }

        /* Polished Grey Box Section */
        .sending-box {
            background-color: #f8f9fa; 
            margin: 0 15px;
            padding: 18px 20px;
            border-radius: 6px; /* Inner curves */
            border: 1px solid #edf0f2;
        }

        /* Flex Row alignment */
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            align-items: center;
        }

        .label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            flex: 1;
        }

        .value {
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            text-align: right;
            flex: 2;
            outline: none;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .big-amount {
            font-size: 24px;
            font-weight: 800;
            color: #1a1a1a;
        }

        .editable:focus {
            background: #fff9c4;
            box-shadow: 0 0 0 4px #fff9c4;
        }
        
        .editable:hover { background: #f0f0f0; cursor: pointer; }

        /* Footer Info */
        .ref-section {
            background: #fff;
            padding-top: 10px;
        }

        .ref-id-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #888;
            background: #fdfdfd;
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed #ddd;
            margin-top: 8px;
            word-break: break-all;
        }

        /* Action Buttons */
        .btn-container { margin-top: 30px; }
        .download-btn {
            padding: 14px 40px;
            background: #111;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .download-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="receipt">
        <div class="main-padding">
            <div class="header">
                <div>
                    <div contenteditable="true" class="bank-name editable">HDFC Bank</div>
                    <div contenteditable="true" class="editable" style="color:var(--text-muted); font-size: 14px;">XXXX0390</div>
                </div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo.png" crossorigin="anonymous" class="upi-logo">
            </div>
        </div>

        <div class="sending-box">
            <div class="row" style="margin-bottom: 8px;">
                <span style="color:var(--text-muted); font-size: 14px;">To:</span>
                <span contenteditable="true" class="editable value" style="font-weight: 700; font-size: 18px;">Keval Rupesh Shah</span>
            </div>
            <div class="row" style="margin-bottom: 0;">
                <span style="color:var(--text-muted); font-size: 14px;">Sending:</span>
                <span class="value big-amount">₹ <span contenteditable="true" class="editable">85,000.00</span></span>
            </div>
        </div>

        <div class="main-padding ref-section">
            <div class="row">
                <span class="label">Paying To</span>
                <span contenteditable="true" class="value editable">Keval Rupesh Shah</span>
            </div>

            <div class="row">
                <span class="label">Amount</span>
                <span class="value" style="font-weight: 700;">₹ <span contenteditable="true" class="editable">85,000.00</span></span>
            </div>

            <div class="row">
                <span class="label">Account</span>
                <span contenteditable="true" class="value editable">XXXXXX0390</span>
            </div>

            <div class="row" style="align-items: flex-start; margin-bottom: 5px;">
                <span class="label">Details</span>
                <span contenteditable="true" class="value editable" style="line-height: 1.4; font-size: 14px;">26700 withdrawal pending charge pay</span>
            </div>

            <div style="margin-top: 15px;">
                <span class="label">Ref ID</span>
                <div contenteditable="true" class="editable ref-id-text">PTM69749e7fe9bf427f9f0ec810e4382fd2</div>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="download-btn" onclick="takeShot()">Download Receipt</button>
    </div>

    <script>
        function takeShot() {
            const btn = document.querySelector('.download-btn');
            btn.innerText = "Generating...";
            
            const receipt = document.getElementById('receipt');
            
            html2canvas(receipt, {
                scale: 3, // Super sharp quality
                useCORS: true, // Fix for image invisibility
                allowTaint: false,
                backgroundColor: null // Transparent corners if needed
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'UPI_Premium_Receipt.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.innerText = "Download Receipt";
            }).catch(err => {
                console.error("Error generating image: ", err);
                alert("Logo load nahi ho paya, please refresh karein.");
                btn.innerText = "Download Receipt";
            });
        }
    </script>
</body>
</html>
